{% extends "base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-secondary text-white"><h5 class="mb-0">تغيير كلمة المرور</h5></div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors.as_text }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary">حفظ</button>
                    <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary ms-2">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
