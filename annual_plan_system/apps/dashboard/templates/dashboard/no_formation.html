{% extends "base.html" %}
{% block title %}لم يتم تحديد التشكيل{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="alert alert-warning shadow">
            <i class="fas fa-exclamation-triangle fa-3x mb-3 text-warning"></i>
            <h4>لم يتم تحديد التشكيل</h4>

            <a href="{% url 'accounts:login' %}" class="btn btn-outline-warning mt-2">العودة</a>
        </div>
    </div>
</div>
{% endblock %}
